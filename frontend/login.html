<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – PotholeAI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom py-3">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <i class="bi bi-cone-striped text-warning fs-3 me-2"></i>
                <span class="text-dark">Pothole<span class="text-primary">AI</span></span>
            </a>
            <div class="ms-auto">
                <span class="text-muted small me-2">Don't have an account?</span>
                <a href="register.html" class="btn btn-outline-primary btn-sm px-3">Register</a>
            </div>
        </div>
    </nav>

    <div class="container py-5 my-auto">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">
                <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
                    <div class="text-center mb-4">
                        <div class="feature-icon-wrapper bg-primary bg-opacity-10 text-primary mx-auto mb-3">
                            <i class="bi bi-shield-lock-fill"></i>
                        </div>
                        <h3 class="fw-bold">Sign In to PotholeAI</h3>
                        <p class="text-muted small">Access citizen reporting or municipal admin dashboard</p>
                    </div>

                    <div id="alertBox" class="alert d-none mb-3 py-2 small" role="alert"></div>

                    <!-- 1-Click Instant Demo Login Buttons -->
                    <div class="p-3 bg-light rounded-3 border mb-4">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="small fw-bold text-dark text-uppercase" style="font-size: 0.75rem;">
                                <i class="bi bi-lightning-charge-fill text-warning me-1"></i> 1-Click Instant Logins
                            </span>
                            <span class="badge bg-success-subtle text-success border border-success-subtle" style="font-size: 0.7rem;">Ready</span>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="button" class="btn btn-primary btn-sm py-2 text-start d-flex justify-content-between align-items-center" onclick="instantLogin('user')">
                                <span><i class="bi bi-person-fill me-2"></i> <b>Citizen Demo</b> (user@potholeai.com)</span>
                                <i class="bi bi-arrow-right"></i>
                            </button>
                            <button type="button" class="btn btn-dark btn-sm py-2 text-start d-flex justify-content-between align-items-center" onclick="instantLogin('admin')">
                                <span><i class="bi bi-shield-fill text-danger me-2"></i> <b>Admin Demo</b> (admin@potholeai.com)</span>
                                <i class="bi bi-arrow-right"></i>
                            </button>
                        </div>
                    </div>

                    <div class="position-relative text-center my-3">
                        <hr class="text-muted opacity-25">
                        <span class="position-absolute top-50 start-50 translate-middle bg-white px-2 small text-muted">or sign in with password</span>
                    </div>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                                <input type="email" id="email" class="form-control bg-light border-start-0" placeholder="name@example.com" value="user@potholeai.com" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-key"></i></span>
                                <input type="password" id="password" class="form-control bg-light border-start-0" placeholder="••••••••" value="user123" required>
                            </div>
                        </div>

                        <button type="submit" id="submitBtn" class="btn btn-outline-primary w-100 py-2 fw-semibold mb-3">
                            <span id="btnSpinner" class="spinner-border spinner-border-sm me-2 d-none"></span>
                            Sign In with Credentials
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <a href="index.html" class="text-decoration-none small text-muted">
                            <i class="bi bi-arrow-left me-1"></i> Return to Home
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        async function instantLogin(role) {
            const email = role === 'admin' ? 'admin@potholeai.com' : 'user@potholeai.com';
            const password = role === 'admin' ? 'admin123' : 'user123';
            document.getElementById('email').value = email;
            document.getElementById('password').value = password;
            await performLogin(email, password);
        }

        async function performLogin(email, password) {
            const alertBox = document.getElementById('alertBox');
            const submitBtn = document.getElementById('submitBtn');
            const btnSpinner = document.getElementById('btnSpinner');

            alertBox.className = 'alert d-none';
            submitBtn.disabled = true;
            btnSpinner.classList.remove('d-none');

            try {
                const user = await API.login(email, password);
                alertBox.className = 'alert alert-success py-2 small';
                alertBox.innerHTML = `<i class="bi bi-check-circle-fill me-1"></i> Welcome <b>${user.name}</b>! Redirecting...`;

                setTimeout(() => {
                    if (user.role === 'ROLE_ADMIN') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'report.html';
                    }
                }, 600);
            } catch (err) {
                alertBox.className = 'alert alert-danger py-2 small';
                alertBox.textContent = err.message || 'Login failed. Please check your credentials.';
                submitBtn.disabled = false;
                btnSpinner.classList.add('d-none');
            }
        }

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            performLogin(email, password);
        });
    </script>
</body>
</html>
