# ====================================================================
# PotholeAI Backend Configuration
# ====================================================================

server.port=8080
spring.application.name=pothole-ai-backend

# --------------------------------------------------------------------
# Database Configuration
# Default: Zero-Config In-Memory DB (Works instantly without installing MySQL!)
# --------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:pothole_ai_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --------------------------------------------------------------------
# MySQL Configuration (Uncomment below if you have MySQL running on port 3306)
# --------------------------------------------------------------------
# spring.datasource.url=jdbc:mysql://localhost:3306/pothole_ai_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --------------------------------------------------------------------
# File Upload Configuration
# --------------------------------------------------------------------
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
file.upload-dir=uploads

# --------------------------------------------------------------------
# AI FastAPI Microservice Configuration
# --------------------------------------------------------------------
ai.service.url=http://localhost:8000/analyze
ai.service.timeout-ms=10000

# --------------------------------------------------------------------
# Telegram Bot API Notifications
# --------------------------------------------------------------------
telegram.bot.enabled=true
telegram.bot.token=YOUR_TELEGRAM_BOT_TOKEN
telegram.bot.chat-id=YOUR_TELEGRAM_CHAT_ID

# --------------------------------------------------------------------
# JWT Authentication Configuration
# --------------------------------------------------------------------
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration-ms=86400000
